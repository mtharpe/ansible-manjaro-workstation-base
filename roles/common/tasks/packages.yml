---
# Install base packages
- name: Install base build tooling
  community.general.pacman:
    name:
      - base-devel
      - linux-headers
      - git
    state: present
    update_cache: true
  become: true

# AUR helper detection / bootstrap. The arch family varies in which AUR helper
# (if any) ships in distro repos:
#   - Manjaro / EndeavourOS / Garuda: `yay` is in official repos
#   - CachyOS: ships `paru` by default
#   - Vanilla Arch: no AUR helper in repos; must bootstrap from AUR
- name: Detect existing AUR helper (yay)
  ansible.builtin.command: which yay
  register: common_yay_check
  changed_when: false
  failed_when: false

- name: Detect existing AUR helper (paru)
  ansible.builtin.command: which paru
  register: common_paru_check
  changed_when: false
  failed_when: false

- name: Try installing yay via pacman (works on Manjaro/EndeavourOS)
  community.general.pacman:
    name: yay
    state: present
  become: true
  failed_when: false
  register: common_yay_pacman
  when:
    - common_yay_check.rc != 0
    - common_paru_check.rc != 0

- name: Bootstrap yay from AUR via makepkg
  ansible.builtin.shell: |
    set -euo pipefail
    rm -rf /tmp/yay-bin
    git clone --depth=1 https://aur.archlinux.org/yay-bin.git /tmp/yay-bin
    cd /tmp/yay-bin
    makepkg -si --noconfirm
  args:
    creates: /usr/bin/yay
    executable: /bin/bash
  become: true
  become_user: "{{ local_user }}"
  when:
    - common_yay_check.rc != 0
    - common_paru_check.rc != 0
    - common_yay_pacman is defined
    - common_yay_pacman.failed | default(false)

- name: Re-detect AUR helper after bootstrap
  ansible.builtin.command: "which {{ item }}"
  register: common_aur_recheck
  changed_when: false
  failed_when: false
  loop:
    - paru
    - yay

- name: Set AUR helper fact
  ansible.builtin.set_fact:
    common_aur_helper: "{{ 'paru' if common_paru_check.rc == 0 else 'yay' }}"

# Install base packages one-by-one, tolerating any single missing package
# (Arch package names sometimes drift; some tools may be AUR-only on certain
# arch-family variants). Niche tools shouldn't block the whole bootstrap.
- name: Install base packages (best-effort)
  community.general.pacman:
    name: "{{ item }}"
    state: present
  loop:
    - direnv
    - fail2ban
    - ansible
    - ansible-lint
    - arpwatch
    - autoconf
    - automake
    - cmake
    - go
    - github-cli
    - htop
    - fastfetch
    - iotop
    - jq
    - lshw
    - lsscsi
    - nfs-utils
    - ngrep
    - nmap
    - nmon
    - npm
    - speedtest-cli
    - sysstat
    - tmux
    - transmission-gtk
    - neovim
    - terraform
    - vault
    - consul
    - nomad
    - packer
    - python-psutil
    - python-pip
    - python-termcolor
    - unzip
    - alacritty
    - vlc
    - util-linux
    - nextcloud-client
    - gnome-shell-extensions
  become: true
  failed_when: false

# AUR-only packages (1Password) installed via the detected AUR helper
- name: Install AUR packages via AUR helper
  ansible.builtin.command:
    cmd: "{{ common_aur_helper }} -S --noconfirm --needed 1password"
  become: true
  become_user: "{{ local_user }}"
  register: common_aur_install
  changed_when: "'Nothing to do' not in common_aur_install.stdout"
  failed_when: false

# Install full ffmpeg + multimedia codec stack (Arch ships these in 'extra')
- name: Install ffmpeg and multimedia codecs
  community.general.pacman:
    name:
      - ffmpeg
      - libva
      - libva-utils
      - gst-libav
      - gst-plugins-bad
      - gst-plugins-ugly
      - a52dec
      - faac
      - faad2
      - flac
      - jasper
      - lame
      - libdca
      - libdv
      - libmad
      - libmpeg2
      - libtheora
      - libvorbis
      - libxv
      - opus
      - wavpack
      - x264
      - xvidcore
    state: present
  become: true
  failed_when: false

# Install OpenH264 codec (Arch ships gst-plugin-openh264 in extra)
- name: Install OpenH264 plugin
  community.general.pacman:
    name:
      - gst-plugin-openh264
    state: present
  become: true
  failed_when: false

# Install molecule via pipx so it gets its own ansible-core in an isolated
# venv. Avoids conflicting with the pacman-installed `ansible` package the
# user needed to bootstrap this playbook. Skipped in containers.
- name: Ensure pipx is installed
  community.general.pacman:
    name: python-pipx
    state: present
  become: true
  when: not is_container | default(false)

- name: Install molecule via pipx
  community.general.pipx:
    name: molecule
    state: install
  become: true
  become_user: "{{ local_user }}"
  when: not is_container | default(false)

- name: Inject molecule-podman driver into the molecule pipx env
  community.general.pipx:
    name: molecule
    state: inject
    inject_packages:
      - molecule-podman
  become: true
  become_user: "{{ local_user }}"
  when: not is_container | default(false)

- name: Ensure pipx PATH is set up for the user
  ansible.builtin.command:
    cmd: pipx ensurepath
  become: true
  become_user: "{{ local_user }}"
  changed_when: false
  when: not is_container | default(false)

# Install podman only if docker is not requested
- name: Install podman if docker is not enabled
  community.general.pacman:
    name:
      - podman
      - podman-docker
    state: present
  when: not install_docker | default(false)
  become: true

# Install extra fonts
- name: Install extra fonts
  community.general.pacman:
    name:
      - adobe-source-code-pro-fonts
      - ttf-dejavu
      - ttf-inconsolata
      - ttf-liberation
      - terminus-font
      - ttf-anonymous-pro
      - gnu-free-fonts
      - noto-fonts
    state: present
  become: true

# Optionally install a Nerd Font (FiraCode) for icons (starship, prompts)
- name: Check if FiraCode Nerd Font is already installed
  ansible.builtin.command:
    cmd: fc-list | grep -i "Fira Code"
  register: common_firacode_fonts
  failed_when: false
  changed_when: false
  when: install_nerd_font | default(false)

- name: Download FiraCode Nerd Font zip
  ansible.builtin.get_url:
    url: "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/FiraCode.zip"
    dest: /tmp/FiraCode.zip
    mode: '0644'
    force: true
  when:
    - install_nerd_font | default(false)
    - common_firacode_fonts.rc != 0

- name: Create nerd fonts directory
  ansible.builtin.file:
    path: /usr/local/share/fonts/nerdfonts
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when: install_nerd_font | default(false)

- name: Unarchive FiraCode Nerd Font
  ansible.builtin.unarchive:
    src: /tmp/FiraCode.zip
    dest: /usr/local/share/fonts/nerdfonts
    remote_src: true
  become: true
  register: common_firacode_unarchive
  when: install_nerd_font | default(false)

- name: Refresh font cache
  ansible.builtin.command:
    cmd: fc-cache -f -v
  become: true
  when:
    - install_nerd_font | default(false)
    - common_firacode_unarchive.changed | default(false)
  changed_when: true

# Uninstall unwanted apps
- name: Uninstall junk apps
  community.general.pacman:
    name:
      - firefox
      - gnome-calendar
      - gnome-contacts
      - gnome-maps
      - rhythmbox
      - totem
      - gnome-tour
      - gnome-logs
    state: absent
  become: true
  failed_when: false
