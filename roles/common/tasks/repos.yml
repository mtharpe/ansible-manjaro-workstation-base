---
# Arch family (Arch, Manjaro, CachyOS, EndeavourOS, Garuda, …): refresh mirrors
# and pacman database. AUR repositories are accessed via an AUR helper
# (installed in packages.yml) instead of dedicated repo files.

# pacman speed tuning — set BEFORE any install so the bigger downloads benefit.
# Older pacman defaulted to serial downloads; modern pacman defaults to 5.
# Bumping to 10 helps on a fast link.
- name: Optimize pacman for parallel downloads
  community.general.ini_file:
    path: /etc/pacman.conf
    section: options
    option: ParallelDownloads
    value: '10'
    no_extra_spaces: true
    mode: '0644'
  become: true

# makepkg.conf controls how AUR packages compile. Use every
# CPU for parallel make.
- name: Optimize makepkg for parallel AUR builds
  ansible.builtin.lineinfile:
    path: /etc/makepkg.conf
    regexp: '^#?\s*MAKEFLAGS='
    line: 'MAKEFLAGS="-j$(nproc)"'
    backrefs: false
  become: true
  failed_when: false   # makepkg.conf may not exist on minimal arch-family images

# Some base images (notably minimal arch-family containers) ship with no
# packages flagged as explicitly-installed. The community.general.pacman module
# preflights every install with `pacman -Qe`, which exits rc=1 when there are
# no explicit packages — and the module treats that as a hard failure. Seed the
# local db with one explicit package so subsequent module calls succeed.
- name: Refresh pacman package database (bootstrap)
  ansible.builtin.command:
    cmd: pacman -Sy --noconfirm
  become: true
  changed_when: false

- name: Mark a base package as explicitly installed (work around community.general.pacman preflight)
  ansible.builtin.command:
    cmd: pacman -D --asexplicit bash
  become: true
  changed_when: false
  failed_when: false

# archlinux-keyring is universal across the Arch family.
- name: Refresh archlinux keyring
  community.general.pacman:
    name:
      - archlinux-keyring
    state: latest
    update_cache: true
  become: true
  failed_when: false

# manjaro-keyring only exists on Manjaro; skip on other arch derivatives.
- name: Refresh manjaro-keyring (Manjaro only)
  community.general.pacman:
    name:
      - manjaro-keyring
    state: latest
  become: true
  failed_when: false
  when: ansible_facts['distribution'] | default('') == 'Manjaro'

# CachyOS ships its own signing keyring for the cachyos-* repos.
- name: Refresh cachyos-keyring (CachyOS only)
  community.general.pacman:
    name:
      - cachyos-keyring
    state: latest
  become: true
  failed_when: false
  when: ansible_facts['distribution'] | default('') == 'CachyOS'

# EndeavourOS ships its own signing keyring for the endeavouros repo.
- name: Refresh endeavouros-keyring (EndeavourOS only)
  community.general.pacman:
    name:
      - endeavouros-keyring
    state: latest
  become: true
  failed_when: false
  when: ansible_facts['distribution'] | default('') == 'EndeavourOS'

- name: Refresh pacman package database
  community.general.pacman:
    update_cache: true
    upgrade: false
  become: true
  changed_when: false
